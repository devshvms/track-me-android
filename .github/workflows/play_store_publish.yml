name: Play Store Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Google Play track to publish to'
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - internal
      publish:
        description: 'Publish the validated AAB to Google Play'
        required: true
        default: false
        type: boolean

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Android signing credentials
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_FILE_BASE64" ] || missing+=(KEYSTORE_FILE_BASE64)
          [ -n "$KEY_ALIAS" ] || missing+=(KEY_ALIAS)
          [ -n "$KEYSTORE_PASSWORD" ] || missing+=(KEYSTORE_PASSWORD)
          [ -n "$KEY_PASSWORD" ] || missing+=(KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Missing Android Play signing secret(s): ${missing[*]}"
            echo "The Play publishing workflow must use the registered upload key; it will not generate a fallback keystore."
            exit 1
          fi

      - name: Decode Keystore
        env:
          KEYSTORE_FILE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_FILE_BASE64" | base64 --decode > app/release.keystore
          if [ ! -s "app/release.keystore" ]; then
            echo "::error::KEYSTORE_FILE_BASE64 did not decode to a keystore file."
            exit 1
          fi
          if ! keytool -list -keystore app/release.keystore -alias "$KEY_ALIAS" -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::The configured Android signing secrets do not open the decoded keystore with the configured alias/password."
            exit 1
          fi

      - name: Decode Google Services JSON
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json 2>/dev/null || true
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

          if ! jq . app/google-services.json >/dev/null 2>&1; then
            echo "Providing valid default schema for app/google-services.json"
            echo '{"project_info":{"project_number":"126912105508","project_id":"trackme-android-1234","storage_bucket":"trackme-android-1234.firebasestorage.app"},"client":[{"client_info":{"mobilesdk_app_id":"1:126912105508:android:a6d760183d8025b6df1cb1","android_client_info":{"package_name":"in.shvms.trackme"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key_for_ci_build_validation"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Calculate Version Code
        # actions/checkout uses a shallow clone by default, making git rev-list
        # report 1 for every workflow run. GitHub's run number is monotonic for
        # this repository and therefore safe for Play's version-code requirement.
        run: echo "VERSION_CODE=${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Build Release AAB
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dummy_password' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dummy_alias' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dummy_password' }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Run release lint and unit tests
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dummy_password' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dummy_alias' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dummy_password' }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        run: ./gradlew :app:lintRelease :app:testReleaseUnitTest

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run release launch smoke test
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'dummy_password' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'dummy_alias' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'dummy_password' }}
          VERSION_CODE: ${{ env.VERSION_CODE }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            ./gradlew assembleRelease
            adb logcat -c
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am force-stop in.shvms.trackme
            adb shell am start -W -n in.shvms.trackme/.MainActivity
            sleep 15
            if adb logcat -d -b crash -v brief | grep -Fq "Process: in.shvms.trackme"; then echo "::error::The release app crashed after launch."; exit 1; fi

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Verify Google Play publish credentials
        if: inputs.publish
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not configured. The AAB was built but cannot be published to Google Play."
            exit 1
          fi
          printf '%s' "$PLAY_JSON" | jq empty

      - name: Upload to Google Play
        if: inputs.publish
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: in.shvms.trackme
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'alpha' }}
          status: completed
          whatsNewDirectory: distribution/whatsnew
