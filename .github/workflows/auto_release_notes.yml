name: Automated Release Notes & Release Creation

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract App Version Name
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      # The release body is shown verbatim to users in the app's update dialog, so it must be the
      # same human-written copy that goes to the Play listing — not a commit log. Raw `git log`
      # previously surfaced things like "Merge branch 'feat/1.6.6-edge-to-edge'" to end users.
      # distribution/whatsnew/whatsnew-en-US is the single source of truth; the commit log is kept
      # only as a fallback, and clearly marked when it appears.
      - name: Generate Release Notes
        run: |
          WHATSNEW="distribution/whatsnew/whatsnew-en-US"
          if [ -s "$WHATSNEW" ]; then
            echo "Using human-written notes from $WHATSNEW"
            cp "$WHATSNEW" release_notes.md
          else
            echo "::warning::$WHATSNEW missing or empty — falling back to the commit log."
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
            {
              echo "### TrackMe v${VERSION}"
              echo ""
              echo "#### Changes"
              git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s"
              echo ""
            } > release_notes.md
          fi

      - name: Create GitHub Release with Auto-Generated Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --title "TrackMe v${VERSION}" \
            --notes-file release_notes.md || echo "Release v${VERSION} already exists or failed"
