name: Automated Release Notes & Release Creation

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: read

jobs:
  create-release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract App Version Name
        id: version
        run: |
          VERSION=$(grep 'versionName = ' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Generate Detailed Release Notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
          echo "### TrackMe Release v${VERSION}" > release_notes.md
          echo "" >> release_notes.md
          echo "#### Changes & Highlights" >> release_notes.md
          git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" >> release_notes.md
          echo "" >> release_notes.md

      - name: Create GitHub Release with Auto-Generated Notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${VERSION}" \
            --title "TrackMe v${VERSION}" \
            --notes-file release_notes.md || echo "Release v${VERSION} already exists or failed"
